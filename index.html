<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LNDscaper</title>
    <style>
        :root { font-family: Georgia, serif; color: #19302b; background: #edf2e8; }
        body { margin: 0; min-height: 100vh; }
        main { width: min(1240px, calc(100% - 48px)); min-height: 100vh; margin: 0 auto; padding: 48px 0; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 680px) minmax(280px, 1fr); gap: 32px; align-items: start; }
        #left-panel, #right-panel { min-height: calc(100vh - 96px); box-sizing: border-box; }
        #right-panel { border: 1px solid #cbd8c1; background: rgba(248, 250, 243, .48); padding: 24px; }
        #right-panel h2 { margin: 0 0 6px; font-size: 1.5rem; }
        #right-panel p { margin: 0 0 20px; font-size: .95rem; }
        h1 { font-size: clamp(2.8rem, 8vw, 5.4rem); line-height: .9; letter-spacing: -.04em; margin: 0 0 18px; }
        p { font-size: 1.15rem; line-height: 1.5; max-width: 540px; }
        form { margin-top: 34px; padding: 28px; border: 1px solid #a8b9a2; background: #f8faf3; box-shadow: 10px 10px 0 #cbd8c1; }
        label { display: block; font-size: .9rem; font-weight: bold; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
        input[type=file] { width: 100%; box-sizing: border-box; padding: 14px; border: 1px dashed #6d8a72; background: white; font: inherit; }
        button { margin-top: 18px; padding: 13px 22px; border: 0; background: #d7603f; color: white; font: bold 1rem Georgia, serif; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        #status { margin-top: 26px; white-space: pre-wrap; }
        dl { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 18px; background: #a8b9a2; }
        dt, dd { margin: 0; padding: 12px; background: #f8faf3; } dt { font-weight: bold; } dd { text-align: right; }
        #blocks-toggle { padding: 0; border: 0; margin: 0; background: transparent; color: inherit; font: inherit; font-weight: bold; cursor: pointer; }
        #blocks-toggle::after { content: '+'; display: inline-block; margin-left: 8px; color: #d7603f; }
        #blocks-toggle[aria-expanded="true"]::after { content: '-'; }
        #block-list { grid-column: 1 / -1; padding: 12px; background: #f8faf3; text-align: left; overflow-x: auto; }
        #block-grid { display: grid; grid-template-columns: repeat(32, minmax(24px, 1fr)); grid-template-rows: repeat(32, minmax(24px, 1fr)); gap: 2px; min-width: 768px; aspect-ratio: 1; }
        #block-grid span { display: grid; min-width: 0; min-height: 0; place-items: center; border: 1px solid #dce4d9; background: #f8faf3; color: #19302b; font: bold .7rem Georgia, serif; }
        #block-grid span[data-block-id] { border-color: #a8b9a2; background: #dce8d5; }
        #block-grid span[data-block-id] { cursor: pointer; }
        #block-grid span[data-block-id][aria-selected="true"] { outline: 2px solid #d7603f; outline-offset: -2px; }
        #cell-grid { display: grid; grid-template-columns: repeat(17, minmax(0, 1fr)); grid-template-rows: repeat(17, minmax(0, 1fr)); gap: 2px; width: 100%; aspect-ratio: 1; }
        #cell-grid span { min-width: 0; min-height: 0; border: 1px solid rgba(25, 48, 43, .18); }
        #cell-grid span[data-water="true"] { background: #8db7bd; }
        #cell-grid span[data-water="false"] { background: #b6c98c; }
        #cell-grid span[data-coastline="true"] { box-shadow: inset 0 0 0 2px #e7d27b; }
        #cell-grid span[data-full-water="true"] { background: #5e8fa0; }
        #textures-toggle { padding: 0; border: 0; margin: 0; background: transparent; color: inherit; font: inherit; font-weight: bold; cursor: pointer; }
        #textures-toggle::after { content: '+'; display: inline-block; margin-left: 8px; color: #d7603f; }
        #textures-toggle[aria-expanded="true"]::after { content: '-'; }
        #texture-list { grid-column: 1 / -1; padding: 12px; background: #f8faf3; text-align: left; }
        #texture-list ul { columns: 2; margin: 0; padding-left: 20px; }
        #texture-list li { padding: 3px 0; }
        @media (max-width: 820px) {
            main { width: min(680px, calc(100% - 40px)); grid-template-columns: 1fr; }
            #left-panel, #right-panel { min-height: 0; }
            #right-panel { min-height: 240px; }
        }
        @media (max-width: 520px) { #block-list ul, #texture-list ul { columns: 1; } }
    </style>
</head>
<body>
    <main>
        <section id="left-panel">
            <h1>LNDscaper</h1>
            <p>Inspect a LND file</p>
            <form id="parser-form">
                <label for="file">Land file</label>
                <input id="file" name="file" type="file" accept=".lnd" required>
                <button type="submit">Read LND file</button>
            </form>
            <section id="status" aria-live="polite"></section>
            <dl id="header-info" hidden>
                <dt><button id="blocks-toggle" type="button" aria-expanded="false" aria-controls="block-list">Blocks</button></dt><dd data-field="numBlocks"></dd>
                <dt>Materials</dt><dd data-field="numMaterials"></dd>
                <dt>Countries</dt><dd data-field="numCountries"></dd>
                <dt>Block size</dt><dd data-field="blockSize"></dd>
                <dt>Material size</dt><dd data-field="materialSize"></dd>
                <dt>Country size</dt><dd data-field="countrySize"></dd>
                <dt><button id="textures-toggle" type="button" aria-expanded="false" aria-controls="texture-list">Low-res textures</button></dt><dd data-field="numLoResTextures"></dd>
                <dd id="block-list" hidden><div id="block-grid" role="grid" aria-label="Blocks by coordinates"></div></dd>
                <dd id="texture-list" hidden></dd>
            </dl>
        </section>
        <aside id="right-panel" aria-label="Selected block details">
            <h2 id="selected-block-title">Select a block</h2>
            <p id="selected-block-description">Click a block in the map to inspect its cells.</p>
            <div id="cell-grid" role="grid" aria-label="Block cells"></div>
        </aside>
    </main>
    <script>
        const form = document.querySelector('#parser-form');
        const file = document.querySelector('#file');
        const button = form.querySelector('button');
        const status = document.querySelector('#status');
        const headerInfo = document.querySelector('#header-info');
        const blocksToggle = document.querySelector('#blocks-toggle');
        const blockList = document.querySelector('#block-list');
        const blockGrid = document.querySelector('#block-grid');
        const texturesToggle = document.querySelector('#textures-toggle');
        const textureList = document.querySelector('#texture-list');
        const selectedBlockTitle = document.querySelector('#selected-block-title');
        const selectedBlockDescription = document.querySelector('#selected-block-description');
        const cellGrid = document.querySelector('#cell-grid');
        let blocks = [];
        let loResTextures = [];

        blocksToggle.addEventListener('click', () => {
            const expanded = blocksToggle.getAttribute('aria-expanded') === 'true';
            blocksToggle.setAttribute('aria-expanded', String(!expanded));
            blockList.hidden = expanded;
        });

        texturesToggle.addEventListener('click', () => {
            const expanded = texturesToggle.getAttribute('aria-expanded') === 'true';
            texturesToggle.setAttribute('aria-expanded', String(!expanded));
            textureList.hidden = expanded;
        });

        function renderBlocks() {
            const cells = Array.from({ length: 32 * 32 }, () => '<span role="gridcell"></span>');
            blocks.forEach((block) => {
                if (block.blockX >= 0 && block.blockX < 32 && block.blockY >= 0 && block.blockY < 32) {
                    cells[block.blockY * 32 + block.blockX] = `<span data-block-id="${block.index}" role="gridcell" tabindex="0" title="Block ${block.index} at (${block.blockX}, ${block.blockY})">${block.index}</span>`;
                }
            });
            blockGrid.innerHTML = cells.join('');
        }

        function renderBlockCells(block) {
            selectedBlockTitle.textContent = `Block ${block.index}`;
            selectedBlockDescription.textContent = `Coordinates (${block.blockX}, ${block.blockY}) | Map position (${block.mapX}, ${block.mapY})`;
            cellGrid.innerHTML = block.cells.map((cell, index) => {
                const color = cell.color?.length >= 3 ? `rgb(${cell.color[0]}, ${cell.color[1]}, ${cell.color[2]})` : '';
                return `<span role="gridcell" data-water="${cell.hasWater}" data-coastline="${cell.coastline}" data-full-water="${cell.fullWater}" style="background-color: ${color}" title="Cell ${index % 17}, ${Math.floor(index / 17)}: altitude ${cell.altitude}, country ${cell.country}"></span>`;
            }).join('');
            blockGrid.querySelectorAll('[data-block-id]').forEach((element) => {
                element.setAttribute('aria-selected', String(element.dataset.blockId === String(block.index)));
            });
        }

        blockGrid.addEventListener('click', (event) => {
            const target = event.target.closest('[data-block-id]');
            if (!target) return;
            const block = blocks.find((item) => String(item.index) === target.dataset.blockId);
            if (block) renderBlockCells(block);
        });

        blockGrid.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            event.target.click();
        });

        function renderTextures() {
            textureList.innerHTML = loResTextures.length
                ? `<ul>${loResTextures.map((texture) => `<li>Texture ${texture.id}: material ${texture.material}, ${texture.numSubTextures} sub-textures (${texture.size} bytes)</li>`).join('')}</ul>`
                : '<p>No low-res textures found.</p>';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!file.files.length) return;
            button.disabled = true;
            status.textContent = 'Parsing...';
            headerInfo.hidden = true;
            blocksToggle.setAttribute('aria-expanded', 'false');
            blockList.hidden = true;
            texturesToggle.setAttribute('aria-expanded', 'false');
            textureList.hidden = true;
            try {
                const response = await fetch('/parse', { method: 'POST', body: new FormData(form) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error);
                headerInfo.querySelectorAll('[data-field]').forEach((field) => {
                    field.textContent = data.header[field.dataset.field];
                });
                blocks = data.blocks;
                loResTextures = data.loResTextures;
                renderBlocks();
                renderTextures();
                headerInfo.hidden = false;
                status.innerHTML = `<p>File parsed successfully.</p>`;
            } catch (error) { status.textContent = error.message; }
            finally { button.disabled = false; }
        });
    </script>
</body>
</html>
